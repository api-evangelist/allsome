name: AllSome
description: AllSome is a Malaysia-based cross-border e-commerce fulfillment, warehousing, and supply-chain
  company serving online marketplace sellers across Southeast Asia. It operates a fulfillment network and
  order-management platform that helps sellers source, store, and ship goods (notably China-to-SEA cross-border
  trade) across channels such as Shopee, Lazada, and TikTok Shop. AllSome is backed by 500 Global and is
  tracked in the API Evangelist network as a portfolio-lead stub; no public developer API surface was
  discoverable during enrichment (the primary website is WAF-protected and returns 403 to automated clients,
  and no api/developer/docs subdomains resolve).
